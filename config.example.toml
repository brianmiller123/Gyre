# 复制本文件为 .agent/config.toml（项目级）或 ~/.config/agent/config.toml（用户级）
# 项目级覆盖用户级（深度合并）。
#
# 环境变量：${VAR} / ${VAR:-default}（POSIX :- 语义：未设置或为空时取默认值）。
# 另外会自动加载 .env（优先级：$GYRE_ENV_FILE > <cwd>/.env > <cwd>/.agent/.env >
# <config_dir>/.env > $HOME/.env；同名键先到先得，真实 shell 环境变量永远优先）。
# 关闭：GYRE_DOTENV=off。

# 界面语言（CLI 与 Web）：en / zh / ru / ja。省略则自动跟随系统语言
# （CLI 读 LANG/LC_*；Web 读 navigator.languages）。新增语言见 crates/i18n/locales。
# language = "zh"

# LLM 请求 User-Agent。缺省/空字符串 = 与 OMP 对齐的默认 UA
# `pi/<version> (platform release; arch)`（格式同 oh-my-pi 线上请求）；
# 部分上游/网关按 UA 识别客户端，需要自定义身份时在此覆盖。
# user_agent = "my-agent/1.0"

[default_model]
id               = "gpt-4o-mini"
api              = "openai-completions"   # 决定 Provider 路由
base_url         = "https://api.openai.com/v1"
api_key          = "${OPENAI_API_KEY}"     # 支持 ${ENV} 展开，永不进日志
temperature      = 0.2
max_input_tokens  = 128000                 # 上下文窗口大小，达 context_window_guard% 触发压缩；
                                           # 留空时按内置模型目录（H25，`agent models catalog`）补缺，未收录模型回退 128000
max_output_tokens = 4096
# tokenizer 家族（H26，可选）：o200k | cl100k | heuristic[:chars_per_token]
# 缺省按模型 id 推断；非 OpenAI provider 建议用近似比（CJK 语料约 1.5，英文约 4），
# 让上下文压缩触发更贴近真实分词密度。
# tokenizer = "heuristic:1.5"

# 额外模型 profile，运行时 `agent --model ds` 切换
[[models]]
id        = "deepseek-chat"
alias     = "ds"
api       = "openai-completions"
base_url  = "https://api.deepseek.com"
api_key   = "${DEEPSEEK_API_KEY}"
temperature = 0.0

# 本地 Ollama（OpenAI 兼容端点；OllamaChat 已被 OpenAiCompletionsAdapter 支持）
[[models]]
id        = "qwen2.5-coder:7b"
alias     = "ollama"
api       = "ollama-chat"
base_url  = "http://localhost:11434/v1"
api_key   = "ollama"            # Ollama 不校验，任意非空即可

# 本地 vLLM（OpenAI 兼容端点）—— extra_body 传递 Provider 特有的非标准参数到请求体顶层。
# 例如 vLLM 的 chat_template_kwargs（控制模板渲染，如 Qwen 思考开关）：
# [[models]]
# id        = "Qwen/Qwen3-32B"
# alias     = "vllm"
# api       = "openai-completions"
# base_url  = "http://localhost:8000/v1"
# api_key   = "EMPTY"
# extra_body = { chat_template_kwargs = { thinking = true } }
#
# 自定义请求头（H24）：同名头覆盖内置鉴权头；值支持 ${ENV} 展开。
# [default_model.headers]
# "HTTP-Referer" = "https://my.app"      # OpenRouter 归因
# "X-Api-Version" = "2024-10-01"
# Authorization = "Bearer ${MY_TOKEN}"   # 网关的非标准鉴权方案
#
# 兼容开关（H24）：仅当网关明确拒绝某参数时开启（默认全关 = 标准 wire）。
# [default_model.quirks]
# omit_stream_options = true   # 不认 stream_options 的网关
# omit_temperature   = true    # 拒绝 temperature 的推理模型
# omit_tool_choice   = true    # 拒绝 tool_choice 的网关
# omit_reasoning     = true    # 拒绝 reasoning_effort 的网关
# max_tokens_field   = "max_completion_tokens"  # 只认 max_completion_tokens 的网关
#
# 鉴权模式（H24）：api_key（默认，分层解析）| none（不发鉴权头）| oauth（只认 OAuth 令牌）
# auth = "none"     # 本地 vLLM / Ollama / 免鉴权网关
#
# omp 风格 compat 段（H24）：与 quirks 取并集；字段名沿用 oh-my-pi 的 camelCase。
# 仅收录 Gyre 实际生效的旗标（未收录的 omp 旗标会被忽略，并在 `agent config check` 中提示）。
# [default_model.compat]
# supportsUsageInStreaming = false   # → 省略 stream_options
# supportsToolChoice      = false    # → 省略 tool_choice
# supportsReasoningEffort = false    # → 省略 reasoning_effort
# maxTokensField          = "max_completion_tokens"

# OpenRouter（单 key 访问 200+ 模型，走 OpenAI 兼容）
[[models]]
id        = "anthropic/claude-3.5-sonnet"
alias     = "or"
api       = "openai-completions"
base_url  = "https://openrouter.ai/api/v1"
api_key   = "${OPENROUTER_API_KEY}"

# GLM（智谱 / Z.ai）官方 API：完整支持 thinking 开关 + reasoning_content 思考内容回显。
# 用专用 api = "zai" 协议（非 openai-completions），否则思考内容不会被解析、思考开关不会发送。
# 国际版 base_url = "https://api.z.ai/api/paas/v4"；国内版（智谱开放平台）用下方 bigmodel.cn。
# 启用思考：在下方 [agent] 段设 enable_thinking = true，GLM 思考模型（glm-4.7+/glm-5+）将
# 显式发送 thinking:{type:"enabled"} + reasoning_effort（high/max），并回显 reasoning_content。
[[models]]
id        = "glm-5.2"
alias     = "glm"
api       = "zai"
base_url  = "https://open.bigmodel.cn/api/paas/v4"   # 国内；国际版改 https://api.z.ai/api/paas/v4
api_key   = "${ZAI_API_KEY}"                          # 或 ${GLM_API_KEY}
max_input_tokens  = 1000000
max_output_tokens = 131072

[agent]
mode                 = "code"            # code | architect | ask | debug（code/debug 写类自动放行）
approval_mode        = "always-ask"      # always-ask | write | yolo。yolo 为判定链最高优先级，压过所有 ask/prompt（仅留 deny 黑名单）
max_mistakes         = 3
context_window_guard = 0.8               # token 占用达 80% 触发压缩
# H26 自动压缩触发策略（三级优先：绝对阈值 > 预留余量 > 百分比 context_window_guard）：
# compaction_threshold_tokens = 180000    # 绝对 token 阈值（最高优先级，钳到 [1, 窗口-1]）
# compaction_reserve_tokens   = 20000     # 预留余量：阈值 = 窗口 - 余量；余量 ≥ 窗口时按 15% 兜底
# 思考模式（reasoning/thinking）
enable_thinking      = false             # 启用后由支持思考的模型消费（如 deepseek-reasoner）
reasoning_budget     = 16000             # 思考 token 预算（可选）
max_turns            = 10000             # agent 最大循环次数（默认 1000；0 = 不限制）
# H40：追加到 system prompt 末尾的定制文本（也可用 --append-system-prompt，flag 优先）。
# CLI flag 取值「含换行 = 字面文本，否则先当文件路径读取」；此处为字面文本。
# append_system_prompt = "始终用中文回答，并在回答末尾列出未验证的假设。"

# H3 异步后台执行（对齐 oh-my-pi `async.enabled` / `async.maxJobs`）：
# run_command 的 `async: true` 参数把命令放入后台作业（立即返回作业 id），
# 完成结果自动投回会话；hub 的 jobs / wait ids / cancel 可查询/等待/取消。
# async_max_jobs 为运行中上限（排队态不占槽位；达上限时后台请求被拒绝）。
async_enabled        = true
async_max_jobs       = 15

# H5 流式守卫（对齐 oh-my-pi stream-guards / auto-generated-guard，全部默认启用）：
# - block_auto_generated：apply_hashline 命中生成文件（zz_generated.* / *.pb.go /
#   *_pb2.py / @generated 头注释等）即流中提前中断 + 执行前拦截。
# - edit_parse_guard：apply_hashline 流式结束时试解析，语法必败即中断本轮让模型修正。
# - tool_loop_guard / tool_loop_threshold / tool_loop_exempt_tools：跨轮同参工具循环
#   检测（连续 N 次参数等价的单工具调用即注入重定向；hub 默认豁免）。
# - gemini_header_guard：Gemini 系模型思考标题连跑 ≥24 行即中断并注入工具提醒。
#[agent.stream_guards]
# block_auto_generated   = true
# edit_parse_guard       = true
# tool_loop_guard        = true
# tool_loop_threshold    = 5
# tool_loop_exempt_tools = ["hub"]
# gemini_header_guard    = true

# 逐工具审批覆盖（优先于 write/always-ask 模式与能力分级；yolo 模式会压过这里的 ask/prompt，
# 仅 deny 仍生效）。code/debug 模式下写类（write_file / str_replace / apply_diff 等）默认已自动
# 放行——编码是其核心能力；若需逐次确认，取消下方注释设为 "prompt"。
[agent.tools.approval]
read_file   = "allow"
# write_file  = "prompt"    # code/debug 默认已放行；取消注释可强制逐次确认
# str_replace = "prompt"    # 同上
run_command = "ask"   # yolo 下被压过（自动放行）；write/always-ask 下仍逐次询问

[agent.commands]
# 命令规则（glob）：allow > deny > ask
#
# 支持两种写法（不可混用于同一键）：
#   简写——裸字符串数组：
#     allow = ["ls", "cat", "grep"]
#   完整——带 pattern 字段的数组表（支持 glob 通配符）：
#     [[agent.commands.allow]]
#     pattern = "cargo *"
#
# 下面用完整写法演示 allow/deny/ask 三类规则：
[[agent.commands.allow]]
pattern = "ls"
[[agent.commands.allow]]
pattern = "cat"
[[agent.commands.allow]]
pattern = "grep"
[[agent.commands.allow]]
pattern = "cargo *"
[[agent.commands.deny]]
pattern = "rm -rf *"
[[agent.commands.ask]]
pattern = "docker *"

# 命令拦截器：把 cat/head/tail、sed -n 'A,Bp'→read_file，grep/rg→grep，find/fd -name→glob，
# ls→list_files，echo/printf>文件、sed -i→write_file 等有专用工具等价物的 shell 命令，
# 在执行前重定向到专用工具（移植 oh-my-pi bashInterceptor）。默认开启；置 false 关闭。
[agent.commands.interceptor]
enabled = true

# 输出最小化器：git/cargo 等已知冗长命令的输出压缩为摘要（省 token）。默认开启；
# 命中过滤器的输出附带「如需完整输出请重跑该命令」提示。max_lines=0 仅按命令类型过滤。
[agent.commands.minimizer]
enabled = true
# max_lines = 1000   # 通用长输出折叠阈值（行数，0 = 不折叠）

[server]
bind = "127.0.0.1:8080"
# auth_token = "${AGENT_SERVER_TOKEN}"

# Agent Client Protocol (ACP) 服务端：为 ACP 兼容客户端（Zed Editor / 自定义前端）
# 提供标准化 JSON-RPC + SSE/stdio 接口。复用同一会话管理与审批机制，与 Web/CLI 等价。
# CLI flag 可运行时覆盖：`agent --acp`（编辑器集成，纯 stdio）或 `agent --serve --acp`（HTTP+SSE）。
[acp]
enabled   = false             # 默认关；true 则 --serve 时自动挂载 /acp/* 路由
transport = "http"            # "http"（HTTP+SSE）/ "stdio" / "both"

[skills]
enabled = true
# custom_directories = ["~/extra-skills"]   # 额外扫描目录（~ 展开，非递归 */SKILL.md）
# ignored = []   # 排除 glob，作用于 skill 名
# included = []  # 包含 glob，空 = 全部

# 跨工具 skill 发现 provider 开关（缺省全开；native 恒开）。同名 skill 按
# priority 去重：native(100) > claude(80) > codex(70) > opencode(55) > github(30)。
# [skills.providers]
# claude   = true   # ~/.claude/skills + 项目 .claude/skills（尊重 CLAUDE_CONFIG_DIR）
# codex    = true   # ~/.codex/skills + 项目 .codex/skills
# opencode = true   # ~/.config/opencode/skills + 项目 .opencode/skills
# github   = true   # 项目 .github/skills

# MCP server。每个 server 暴露的工具自动注册为 agent 工具。
# 两种传输形态（按必填键区分）：
# - stdio：子进程 JSON-RPC 2.0（含 command 即 stdio，向后兼容）
# - http：Streamable HTTP（含 url 即 http；POST JSON-RPC + 可选 SSE 响应流）
[mcp.servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

[mcp.servers.remote]
url = "http://127.0.0.1:3000/mcp"
timeout_ms = 30000   # 单请求超时（毫秒）；0 = 不限制，缺省 30000
# 传输模式 `type`：`"http"`（默认，Streamable HTTP）或 `"sse"`（2024-11-05 规范前的
# legacy HTTP+SSE 存量 server，对齐 oh-my-pi）；`transport = ...` 为等价别名。
# type = "sse"
[mcp.servers.remote.headers]
Authorization = "Bearer ${MCP_TOKEN}"

# Remote MCP OAuth（`agent mcp login remote` 交互登录；凭据落 oauth.toml 的
# `mcp_oauth:<url>` 行，会话连接时自动携带 Bearer 并在过期/401 时刷新重试）。
# 全部可选：缺省走 RFC 9728/8414 自动发现 + RFC 7591 动态客户端注册（DCR）；
# 显式 client_id 供不开放 DCR 的服务商（如 Figma MCP Catalog 白名单制）。
# [mcp.servers.remote.oauth]
# client_id = "..."          # 手工 client id（跳过 DCR）
# client_secret = "..."      # 机密客户端才需要
# scope = "mcp:read mcp:write"
# callback_port = 3000       # 回环回调端口（缺省 3000）
# prompt = ""                # `""` 强制省略；缺省仅 offline_access 时补 consent
# resource = "https://..."   # RFC 8707 资源指示（缺省自动发现，兜底 server URL）

# 外部 MCP 配置源（Claude/Cursor 风格 JSON，对齐 oh-my-pi discovery）：
#   user    <config_dir>/agent/mcp.json
#   project <cwd>/.agent/mcp.json → <cwd>/mcp.json → <cwd>/.mcp.json（后者优先）
# 形状：{ "mcpServers": { "<name>": { "command": ..., "args": [...], "env": {...} }
#                        | { "url": ..., "headers": {...}, "type": "http"|"sse" } },
#        "disabledServers": ["<name>", ...] }
# 同名冲突时上面的 [mcp.servers] 条目胜出；disabledServers 与每 server 的
# "enabled": false 一律剔除（拒绝名单压过一切来源）。
# 增删与启停：`agent mcp add|remove|enable|disable|list|status`（REPL 内为
# `/mcp add|remove|enable|disable|list|status`）；`--project` 写项目级文件，
# 缺省写 user 级。启动预算（250ms）外未完成握手的 server 转后台连接：有上次
# 成功清单快照（版本 + 配置指纹 + 30 天 TTL 全中）时先以「延迟连接」工具注册。

# 跨会话长期记忆（按 cwd 项目作用域；启动注入摘要 + 后端按需合并）
[memory]
# H30 合并执行方式：false（默认）= 停止边界内联等待 LLM 沉淀；
# true = 放入后台任务（停止边界不被阻塞），并发由租约互斥。
# background_consolidate = true
enabled = false          # 默认关；启用后跨会话积累技术决策/惯例/已踩坑
# 后端：local（默认，MEMORY.md + notes.jsonl + LLM 合并）|
#       structured（records.jsonl + 向量融合检索；L2 语义嵌入需以 --features vec-embed 编译，
#                   否则回退 L1 确定性投影嵌入；任务末 LLM 沉淀 working → episodic）
backend = "local"
auto_consolidate = true  # 任务结束触发 LLM 合并（local：raw notes → MEMORY.md；structured：未沉淀记录 → 提炼条目）
auto_retain_every_n_turns = 4  # 循环内自动沉淀：每 N 个停止轮把本轮输出写入记忆（0 = 关闭）

# GitHub 工具（查询/操作 PR、issue、Actions(CI)），按需加载以控制上下文成本。
# enabled = true 启动即注册工具并把使用指引注入 system prompt；
#   运行时也可用 `/github on|off|write` 动态切换——仅启用时才注入提示词，
#   未启用完全屏蔽（零 Token 开销）。鉴权读取环境变量 GH_TOKEN / GITHUB_TOKEN。
[github]
enabled = false       # 默认关；启用后可 get/list PR/issue/Actions、graphql
allow_write = false   # 另允许 create_pr/merge_pr/comment（提升至更高审批门禁）

# 可选工具组开关：仅启用组才注册工具并把操作提示词注入 system prompt；
# 未启用完全屏蔽（工具不进 LLM 工具列表、提示词不进上下文），严格控制初始 Token 开销。
# 运行时也可用 `/tools <key> on|off` 动态切换（切换后重建 Agent 即时生效）。
# 核心工具（read_file/write_file/str_replace/apply_diff/list_files/run_command/grep/glob）
# 始终启用，不受此控制；GitHub 由上面 [github] enabled 控制。
[tools.enabled]
# ast      = true    # replace_block / ast_search / ast_rewrite（tree-sitter 句法感知）
# lsp      = true    # 诊断/定义/引用/重命名（需工作区可发现语言服务器）
# image    = true    # read_image / image_gen（后者需 IMAGE_API_KEY/OPENAI_API_KEY）
# hashline = false   # 关闭 apply_hashline（默认启用：行锚定批量编辑，多文件多区间）
# pty      = true    # run_pty_command 工具 + run_command 的 `pty:true`（TTY 依赖命令）
# debug    = true    # debug 工具（DAP 调试器：自动探测 lldb-dap/dlv/debugpy，14 动作）
# ssh      = true    # ssh 工具（解析 ~/.ssh/config，远程命令执行；BatchMode 非交互）
# browser  = true    # browser 工具（CDP 驱动 chromium：navigate/evaluate/screenshot/click/text/scroll）

# 子 Agent（task 委派 + swarm 多代理编排）统一配置。
# 控制 task 工具开关、并发护栏、是否继承父 temperature/thinking、独立 token 预算。
[ttsr]
# enabled = true          # 缺省：存在规则即启用；false 关闭
# disabled_rules = ["no-box-leak"]   # 按规则名禁用（对内置规则同样生效）
# builtin_rules = true    # 随二进制的 27 条内置规则（Go/Rust/TS 约定，只提醒不打断）；
#                         # false 时只加载 .gyre/rules/*.md 中的规则

# goals 目标预算：累计记账（input + cache_write + output）与墙钟超限后注入提醒/硬停。
# 软模式（默认）超限后在停止边界注入提醒并续跑一轮，模型自行收尾；硬模式直接停止。
[goals]
# token_budget = 200000    # 累计 token 上限（0 = 不限）
# time_budget_secs = 1800  # 墙钟上限（秒，0 = 不限）
# hard_stop = false        # 超限硬停（true 停止；false 注入提醒后继续）

# todo 循环（H28）：eager prelude 与完成提醒续跑。
# eager = "off"（默认，不注入）| "preferred"（首轮提醒先规划）| "always"（提醒并强制首轮先调用 todo）
# reminders = true（默认）：模型在仍有未完成待办时停止 → 注入提醒并续跑
# reminders_max = 3：单轮 prompt 内提醒次数上限（0 = 不限）
[todo]
# eager = "preferred"
# reminders = false
# reminders_max = 5
# mid_run_nudge = true   # 连续 12 次变更类工具调用未触碰 todo 时，中途提醒对账（每次 run 上限 2）

# H5 键位覆盖（可选）：键为动作名（/hotkeys 可见），值为键位（ctrl-y / alt-enter / f5 …）。
# 未知动作或非法键位只告警并忽略（非法值回退默认键）。可绑定动作：
#   app.interrupt / app.clear / app.exit / app.history.search / app.complete
#   app.message.dequeue / app.retry / app.session.new / app.command.queueList / app.command.settings
# [keybindings]
# "app.message.dequeue" = "alt-d"
# "app.clear" = "f5"
# "app.retry" = "ctrl-t"

# [compaction]
# backend       = "summarize"  # summarize（本地 LLM handoff 摘要，默认）| snapcompact（本地 PNG 帧渲染，要求视觉模型）
# vision_models = ["claude-*", "gpt-4o*", "gemini-*"]  # snapcompact 时视为视觉模型的通配清单；空 = 任何模型
# max_frames    = 80           # snapcompact 帧数预算（超出丢中间帧保首尾）
# remote_endpoint = "http://127.0.0.1:8787/v1/chat/completions"  # 远程压缩端点（可选）：路径以 /chat/completions 结尾用 OpenAI 兼容格式，否则自定义 {systemPrompt, prompt} → {summary}；失败自动回退本地 LLM

# eval 内核（Python NDJSON 持久内核 + 127.0.0.1 环回桥，可回调 agent 工具 tool.<name>）。
# 默认关闭（零 Token 开销）；env GYRE_EVAL=1 亦可启用。
[eval]
# enabled = true
# python = "python3"        # 解释器路径
# idle_timeout_secs = 300   # 内核空闲回收（秒）
[subagent]
# H41 名册容量：子代理在册上限（0 = 不限；不含父 agent）。达上限后 task 在派生前拒绝。
# max_registry = 8
enabled            = true      # 总开关：false 则不注册 task 工具，且 /swarm 拒绝执行
max_concurrent     = 4         # 同波/并行子 Agent 最大并发数（信号量护栏，防触发上游速率限制）
inherit_parent     = true      # 子 Agent 是否继承父 temperature / thinking（消除「父思考、子不思考」割裂）
# max_output_tokens = 8192     # 子 Agent 独立输出 token 预算；留空则回退到 [default_model].max_output_tokens
# task 工具支持单任务（task）与并行多任务（tasks 数组）；多任务按 max_concurrent 并发执行后聚合。

# SOCKS5 出站代理（仅影响后端发出的 HTTP/HTTPS 请求，如 LLM API；前端浏览器自身访问
# 不经此代理）。host/port 齐全才算「已配置」；配置不完整时自动禁用代理并在启动时告警，
# 不阻断启动。Web 设置页检测到已配置时会显示「启用 SOCKS5 代理」开关，切换实时生效
# （无需重启），选择持久化到 <cwd>/.gyre/socks5.state，下次启动自动恢复。
# 优先级：CLI（--socks host:port 给出即启用；认证另用 --socks-user/--socks-pass）
# ＞ 持久化开关 ＞ 本配置。
[socks5]
enabled            = false          # 总开关（默认关；Web 可在已配置时运行时切换）
# host               = "127.0.0.1"     # 代理主机（host/port 齐全才算「已配置」）
# port               = 1080            # 代理端口
# username           = "user"          # 可选；设置即启用 RFC1929 用户名/密码认证
# password           = "${SOCKS5_PASSWORD}"  # 可选；支持 ${ENV} 展开，SecretString 存储，永不进日志；仅密码无用户名会被忽略
# connect_timeout_secs = 10            # 代理连接（含 SOCKS5 握手）超时，默认 10
