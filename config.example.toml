# 复制本文件为 .agent/config.toml（项目级）或 ~/.config/agent/config.toml（用户级）
# 项目级覆盖用户级（深度合并）。

# 界面语言（CLI 与 Web）：en / zh / ru / ja。省略则自动跟随系统语言
# （CLI 读 LANG/LC_*；Web 读 navigator.languages）。新增语言见 crates/i18n/locales。
# language = "zh"

# LLM 请求 User-Agent。缺省/空字符串 = 与 OMP 对齐的默认 UA
# `pi/<version> (platform release; arch)`（格式同 oh-my-pi 线上请求）；
# 部分上游/网关按 UA 识别客户端，需要自定义身份时在此覆盖。
# user_agent = "my-agent/1.0"

[default_model]
id               = "gpt-4o-mini"
api              = "openai-completions"   # 决定 Provider 路由
base_url         = "https://api.openai.com/v1"
api_key          = "${OPENAI_API_KEY}"     # 支持 ${ENV} 展开，永不进日志
temperature      = 0.2
max_input_tokens  = 128000                 # 上下文窗口大小，达 context_window_guard% 触发压缩；留空回退 128000
max_output_tokens = 4096

# 额外模型 profile，运行时 `agent --model ds` 切换
[[models]]
id        = "deepseek-chat"
alias     = "ds"
api       = "openai-completions"
base_url  = "https://api.deepseek.com"
api_key   = "${DEEPSEEK_API_KEY}"
temperature = 0.0

# 本地 Ollama（OpenAI 兼容端点；OllamaChat 已被 OpenAiCompletionsAdapter 支持）
[[models]]
id        = "qwen2.5-coder:7b"
alias     = "ollama"
api       = "ollama-chat"
base_url  = "http://localhost:11434/v1"
api_key   = "ollama"            # Ollama 不校验，任意非空即可

# 本地 vLLM（OpenAI 兼容端点）—— extra_body 传递 Provider 特有的非标准参数到请求体顶层。
# 例如 vLLM 的 chat_template_kwargs（控制模板渲染，如 Qwen 思考开关）：
# [[models]]
# id        = "Qwen/Qwen3-32B"
# alias     = "vllm"
# api       = "openai-completions"
# base_url  = "http://localhost:8000/v1"
# api_key   = "EMPTY"
# extra_body = { chat_template_kwargs = { thinking = true } }

# OpenRouter（单 key 访问 200+ 模型，走 OpenAI 兼容）
[[models]]
id        = "anthropic/claude-3.5-sonnet"
alias     = "or"
api       = "openai-completions"
base_url  = "https://openrouter.ai/api/v1"
api_key   = "${OPENROUTER_API_KEY}"

# GLM（智谱 / Z.ai）官方 API：完整支持 thinking 开关 + reasoning_content 思考内容回显。
# 用专用 api = "zai" 协议（非 openai-completions），否则思考内容不会被解析、思考开关不会发送。
# 国际版 base_url = "https://api.z.ai/api/paas/v4"；国内版（智谱开放平台）用下方 bigmodel.cn。
# 启用思考：在下方 [agent] 段设 enable_thinking = true，GLM 思考模型（glm-4.7+/glm-5+）将
# 显式发送 thinking:{type:"enabled"} + reasoning_effort（high/max），并回显 reasoning_content。
[[models]]
id        = "glm-5.2"
alias     = "glm"
api       = "zai"
base_url  = "https://open.bigmodel.cn/api/paas/v4"   # 国内；国际版改 https://api.z.ai/api/paas/v4
api_key   = "${ZAI_API_KEY}"                          # 或 ${GLM_API_KEY}
max_input_tokens  = 1000000
max_output_tokens = 131072

[agent]
mode                 = "code"            # code | architect | ask | debug（code/debug 写类自动放行）
approval_mode        = "always-ask"      # always-ask | write | yolo。yolo 为判定链最高优先级，压过所有 ask/prompt（仅留 deny 黑名单）
max_mistakes         = 3
context_window_guard = 0.8               # token 占用达 80% 触发压缩
# 思考模式（reasoning/thinking）
enable_thinking      = false             # 启用后由支持思考的模型消费（如 deepseek-reasoner）
reasoning_budget     = 16000             # 思考 token 预算（可选）
max_turns            = 10000             # agent最大循环次数

# 逐工具审批覆盖（优先于 write/always-ask 模式与能力分级；yolo 模式会压过这里的 ask/prompt，
# 仅 deny 仍生效）。code/debug 模式下写类（write_file / str_replace / apply_diff 等）默认已自动
# 放行——编码是其核心能力；若需逐次确认，取消下方注释设为 "prompt"。
[agent.tools.approval]
read_file   = "allow"
# write_file  = "prompt"    # code/debug 默认已放行；取消注释可强制逐次确认
# str_replace = "prompt"    # 同上
run_command = "ask"   # yolo 下被压过（自动放行）；write/always-ask 下仍逐次询问

[agent.commands]
# 命令规则（glob）：allow > deny > ask
#
# 支持两种写法（不可混用于同一键）：
#   简写——裸字符串数组：
#     allow = ["ls", "cat", "grep"]
#   完整——带 pattern 字段的数组表（支持 glob 通配符）：
#     [[agent.commands.allow]]
#     pattern = "cargo *"
#
# 下面用完整写法演示 allow/deny/ask 三类规则：
[[agent.commands.allow]]
pattern = "ls"
[[agent.commands.allow]]
pattern = "cat"
[[agent.commands.allow]]
pattern = "grep"
[[agent.commands.allow]]
pattern = "cargo *"
[[agent.commands.deny]]
pattern = "rm -rf *"
[[agent.commands.ask]]
pattern = "docker *"

# 命令拦截器：把 cat/head/tail、sed -n 'A,Bp'→read_file，grep/rg→grep，find/fd -name→glob，
# ls→list_files，echo/printf>文件、sed -i→write_file 等有专用工具等价物的 shell 命令，
# 在执行前重定向到专用工具（移植 oh-my-pi bashInterceptor）。默认开启；置 false 关闭。
[agent.commands.interceptor]
enabled = true

# 输出最小化器：git/cargo 等已知冗长命令的输出压缩为摘要（省 token）。默认开启；
# 命中过滤器的输出附带「如需完整输出请重跑该命令」提示。max_lines=0 仅按命令类型过滤。
[agent.commands.minimizer]
enabled = true
# max_lines = 1000   # 通用长输出折叠阈值（行数，0 = 不折叠）

[server]
bind = "127.0.0.1:8080"
# auth_token = "${AGENT_SERVER_TOKEN}"

# Agent Client Protocol (ACP) 服务端：为 ACP 兼容客户端（Zed Editor / 自定义前端）
# 提供标准化 JSON-RPC + SSE/stdio 接口。复用同一会话管理与审批机制，与 Web/CLI 等价。
# CLI flag 可运行时覆盖：`agent --acp`（编辑器集成，纯 stdio）或 `agent --serve --acp`（HTTP+SSE）。
[acp]
enabled   = false             # 默认关；true 则 --serve 时自动挂载 /acp/* 路由
transport = "http"            # "http"（HTTP+SSE）/ "stdio" / "both"

[skills]
enabled = true
enable_commands = false
# custom_directories = ["~/extra-skills"]   # 额外扫描目录（~ 展开，非递归 */SKILL.md）
# ignored = []   # 排除 glob，作用于 skill 名
# included = []  # 包含 glob，空 = 全部

# MCP server（stdio JSON-RPC 2.0）。每个 server 暴露的工具自动注册为 agent 工具。
[mcp.servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]

# 跨会话长期记忆（按 cwd 项目作用域；启动注入摘要 + 后端按需合并）
[memory]
enabled = false          # 默认关；启用后跨会话积累技术决策/惯例/已踩坑
# 后端：local（默认，MEMORY.md + notes.jsonl + LLM 合并）|
#       structured（records.jsonl + 向量融合检索；L2 语义嵌入需以 --features vec-embed 编译，
#                   否则回退 L1 确定性投影嵌入；任务末 LLM 沉淀 working → episodic）
backend = "local"
auto_consolidate = true  # 任务结束触发 LLM 合并（local：raw notes → MEMORY.md；structured：未沉淀记录 → 提炼条目）
auto_retain_every_n_turns = 4  # 循环内自动沉淀：每 N 个停止轮把本轮输出写入记忆（0 = 关闭）

# GitHub 工具（查询/操作 PR、issue、Actions(CI)），按需加载以控制上下文成本。
# enabled = true 启动即注册工具并把使用指引注入 system prompt；
#   运行时也可用 `/github on|off|write` 动态切换——仅启用时才注入提示词，
#   未启用完全屏蔽（零 Token 开销）。鉴权读取环境变量 GH_TOKEN / GITHUB_TOKEN。
[github]
enabled = false       # 默认关；启用后可 get/list PR/issue/Actions、graphql
allow_write = false   # 另允许 create_pr/merge_pr/comment（提升至更高审批门禁）

# 可选工具组开关：仅启用组才注册工具并把操作提示词注入 system prompt；
# 未启用完全屏蔽（工具不进 LLM 工具列表、提示词不进上下文），严格控制初始 Token 开销。
# 运行时也可用 `/tools <key> on|off` 动态切换（切换后重建 Agent 即时生效）。
# 核心工具（read_file/write_file/str_replace/apply_diff/list_files/run_command/grep/glob）
# 始终启用，不受此控制；GitHub 由上面 [github] enabled 控制。
[tools.enabled]
# ast      = true    # replace_block / ast_search / ast_rewrite（tree-sitter 句法感知）
# lsp      = true    # 诊断/定义/引用/重命名（需工作区可发现语言服务器）
# image    = true    # read_image / image_gen（后者需 IMAGE_API_KEY/OPENAI_API_KEY）
# hashline = false   # 关闭 apply_hashline（默认启用：行锚定批量编辑，多文件多区间）
# pty      = true    # run_pty_command（TTY 依赖命令：top/vim/交互式 REPL）
# debug    = true    # debug 工具（DAP 调试器：自动探测 lldb-dap/dlv/debugpy，14 动作）
# ssh      = true    # ssh 工具（解析 ~/.ssh/config，远程命令执行；BatchMode 非交互）
# browser  = true    # browser 工具（CDP 驱动 chromium：navigate/evaluate/screenshot/click/text/scroll）

# 子 Agent（task 委派 + swarm 多代理编排）统一配置。
# 控制 task 工具开关、并发护栏、是否继承父 temperature/thinking、独立 token 预算。
[ttsr]
# enabled = true          # 缺省：存在规则即启用；false 关闭
# disabled_rules = ["no-box-leak"]   # 按规则名禁用

# goals 目标预算：累计记账（input + cache_write + output）与墙钟超限后注入提醒/硬停。
# 软模式（默认）超限后在停止边界注入提醒并续跑一轮，模型自行收尾；硬模式直接停止。
[goals]
# token_budget = 200000    # 累计 token 上限（0 = 不限）
# time_budget_secs = 1800  # 墙钟上限（秒，0 = 不限）
# hard_stop = false        # 超限硬停（true 停止；false 注入提醒后继续）

# [compaction]
# backend       = "summarize"  # summarize（本地 LLM handoff 摘要，默认）| snapcompact（本地 PNG 帧渲染，要求视觉模型）
# vision_models = ["claude-*", "gpt-4o*", "gemini-*"]  # snapcompact 时视为视觉模型的通配清单；空 = 任何模型
# max_frames    = 80           # snapcompact 帧数预算（超出丢中间帧保首尾）
# remote_endpoint = "http://127.0.0.1:8787/v1/chat/completions"  # 远程压缩端点（可选）：路径以 /chat/completions 结尾用 OpenAI 兼容格式，否则自定义 {systemPrompt, prompt} → {summary}；失败自动回退本地 LLM

# eval 内核（Python NDJSON 持久内核 + 127.0.0.1 环回桥，可回调 agent 工具 tool.<name>）。
# 默认关闭（零 Token 开销）；env GYRE_EVAL=1 亦可启用。
[eval]
# enabled = true
# python = "python3"        # 解释器路径
# idle_timeout_secs = 300   # 内核空闲回收（秒）
[subagent]
enabled            = true      # 总开关：false 则不注册 task 工具，且 /swarm 拒绝执行
max_concurrent     = 4         # 同波/并行子 Agent 最大并发数（信号量护栏，防触发上游速率限制）
inherit_parent     = true      # 子 Agent 是否继承父 temperature / thinking（消除「父思考、子不思考」割裂）
# max_output_tokens = 8192     # 子 Agent 独立输出 token 预算；留空则回退到 [default_model].max_output_tokens
# task 工具支持单任务（task）与并行多任务（tasks 数组）；多任务按 max_concurrent 并发执行后聚合。

# SOCKS5 出站代理（仅影响后端发出的 HTTP/HTTPS 请求，如 LLM API；前端浏览器自身访问
# 不经此代理）。host/port 齐全才算「已配置」；配置不完整时自动禁用代理并在启动时告警，
# 不阻断启动。Web 设置页检测到已配置时会显示「启用 SOCKS5 代理」开关，切换实时生效
# （无需重启），选择持久化到 <cwd>/.gyre/socks5.state，下次启动自动恢复。
# 优先级：CLI（--socks host:port 给出即启用；认证另用 --socks-user/--socks-pass）
# ＞ 持久化开关 ＞ 本配置。
[socks5]
enabled            = false          # 总开关（默认关；Web 可在已配置时运行时切换）
# host               = "127.0.0.1"     # 代理主机（host/port 齐全才算「已配置」）
# port               = 1080            # 代理端口
# username           = "user"          # 可选；设置即启用 RFC1929 用户名/密码认证
# password           = "${SOCKS5_PASSWORD}"  # 可选；支持 ${ENV} 展开，SecretString 存储，永不进日志；仅密码无用户名会被忽略
# connect_timeout_secs = 10            # 代理连接（含 SOCKS5 握手）超时，默认 10
