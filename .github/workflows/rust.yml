name: Rust

on:
  push:
    branches: [ "main" ]
    # ⚠️ 关键：branches 过滤器会排除 tag 推送，必须显式加 tags 才能在打 tag 时触发 release
    tags:
      - 'v*'
    # paths 过滤（对齐 omp ci.yml）：纯文档改动不烧 CI。注意 GitHub 对 tag push 也会
    # 评估 paths 过滤器（按 tag 相对上一 ref 的 diff）；发布提交必然触碰 Cargo.toml/
    # Cargo.lock（版本号），不在忽略列表内，因此 release 永远不会被该过滤器跳过。
    # 极端情况（如对同一 commit 重复打 tag）可用 workflow_dispatch 手动补跑。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.gitignore'
  # 手动触发逃生口：paths 过滤器对 workflow_dispatch 不生效
  workflow_dispatch:

# release 并发组（对齐 omp ci.yml #2564 教训）：tag 触发的 release 用独立 release-<sha>
# 组且【不取消】——main 上的后续 push 绝不能掐断在途发布；普通分支/PR 维持按 ref 分组
# 可取消，避免 churn 堆积。
concurrency:
  group: "${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/v') && format('release-{0}', github.sha) || github.ref }}"
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  CARGO_TERM_COLOR: always
  # 注意：不再设置 RUSTFLAGS=-A warnings —— 警告必须被看见并在 lint 门清零

# 默认只读；需要写 Release 的 job（build / release_sums）在 job 级显式提权
# （对齐 omp 的最小权限分层）
permissions:
  contents: read

jobs:
  # ─── 执法门 1：格式 + 静态检查（clippy 全量 -D warnings）────────────────────────
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy (deny all warnings)
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

  # ─── 执法门 2：测试（nextest；retries=0 见 .config/nextest.toml）────────────────
  test:
    name: Test (nextest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests (nextest)
        run: cargo nextest run --workspace

      # nextest 不执行 doctests，单独补跑
      - name: Run doctests
        run: cargo test --workspace --doc

  # ─── 执法门 3：依赖合规（cargo-deny；对齐 omp ci.yml 的 deny 步骤）──────────────
  deny:
    name: Deny (licenses / bans / sources)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 预编译二进制安装（秒级），避免 cargo install 从源码编译数分钟；版本显式
      # pin 与本地验证过的 0.20.2 一致，防止 config 语法漂移
      - name: Install cargo-deny (0.20.2)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      # `--offline` 需要索引已填充（omp 同款注释）：PR 用全新 runner，先 fetch 一次
      - name: Fetch crates index
        run: cargo fetch --locked

      # 硬门：许可证 / bans / 来源（本地已用 0.20.2 对实际依赖图验证通过）
      - name: cargo deny check (licenses, bans, sources)
        run: cargo deny --locked --offline check licenses bans sources

      # 软门：安全通告（RustSec/OSV）。advisories DB 需联网拉取，且新通告随时间
      # 不断出现——先不阻塞合入，triage 机制建立后升级为硬门（见原任务说明）
      - name: cargo deny check (advisories, warn only)
        continue-on-error: true
        run: cargo deny --locked check advisories

  # ─── 构建 + 发布（matrix 5 目标；release 步骤仅在 tag 触发时执行）───────────────
  build:
    # ✨ Matrix：Linux gnu/musl(x86_64+aarch64) + macOS arm64 + Windows x86_64
    # 全部 leg 并行，fail-fast=false 保证一个失败不影响另一个继续跑完，便于排查
    #
    # ⚠️ musl 两个目标 continue-on-error（experimental=true）：
    # fastembed(ort) 在 musl/aarch64 的兼容性未验证（报告不确定项 #11）——
    # 发布构建默认特性不含 vec-embed（fastembed 仅 crates/memory 的可选 feature），
    # 理论上不引入 ort；但 rusqlite bundled 的 C 交叉编译链尚未在 CI 实跑验证过，
    # 先放行失败不阻塞 release，稳定后再移除。
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── 原有 2 目标 ──
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: agent                       # cargo build 产物名（Linux 无后缀）
            artifact: agent-linux-amd64         # 上传到 Release 的最终文件名
            tool: cargo                         # 本机构建
            smoke: native                       # 本机直接 --version 冒烟
            experimental: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: agent.exe                   # Windows 产物带 .exe
            artifact: agent-windows-amd64.exe
            tool: cargo
            smoke: native
            experimental: false
          # ── 新增 3 目标（ musl ×2 / darwin-arm64 ×1 ）──
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: agent
            artifact: agent-linux-amd64-musl
            tool: cross                         # cross-rs 容器内交叉编译（自带 musl-gcc，供 rusqlite bundled 等构建脚本用）
            smoke: alpine                       # glibc 宿主跑不了 musl，用 Alpine 容器冒烟
            experimental: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: agent
            artifact: agent-linux-arm64-musl
            tool: cross
            smoke: alpine                       # 同上，另需 QEMU binfmt（下方按 matrix.qemu 装置）
            qemu: true
            experimental: true
          - os: macos-14                        # arm64 runner：aarch64-apple-darwin 本机构建
            target: aarch64-apple-darwin
            binary: agent
            artifact: agent-darwin-arm64
            tool: cargo
            smoke: native
            experimental: false

    runs-on: ${{ matrix.os }}

    # musl leg 实验性：失败不阻塞整个 build job（也不阻塞下游 release_sums 对
    # 资产完整性的硬校验——缺失资产会在那里被点名）
    continue-on-error: ${{ matrix.experimental || false }}

    # 赋予工作流创建 Release 的写入权限
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ✨ 核心增补 1：必须先安装 Node.js 环境
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # 根据你的前端需求指定版本
        cache: 'npm'       # 自动缓存 npm 依赖，加速安装
        cache-dependency-path: 'web/c5-ui/package-lock.json'

    - name: Set up Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: ${{ matrix.target }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}   # 按平台分桶缓存，避免不同 target 的缓存互相污染

    # 交叉编译目标：cross-rs（Docker 容器内自带对应 C 交叉工具链）
    - name: Install cross
      if: matrix.tool == 'cross'
      uses: taiki-e/install-action@v2
      with:
        tool: cross

    # aarch64 musl 的容器冒烟需要 QEMU binfmt（ubuntu runner 默认未注册 arm64）
    - name: Set up QEMU
      if: matrix.qemu == true
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64

    # ✨ 核心改进 2：构建前端。
    # vite outDir 指向仓库根 web/（rust-embed 服务目录），`npm run build` 即完成部署，
    # 无需（也不再有）独立的 deploy 脚本。
    # npm ci（硬化）：严格按 package-lock.json 安装，锁定依赖树与可复现构建；
    # lockfile 与 package.json 不同步时直接失败（npm install 会静默改写）
    - name: Build Frontend
      working-directory: web/c5-ui   # 直接指定工作目录，无需手动 cd
      shell: bash                    # 统一用 bash，保证跨平台行为一致
      run: |
        npm ci
        npm run build

    # ✨ 核心改进 3：编译 Rust 后端（统一 --target，产物落在 target/<triple>/release/，
    # 与交叉编译 leg 同构，产物路径由下方 SRC 统一解析）
    - name: Build Rust Backend
      run: ${{ matrix.tool }} build -r --target ${{ matrix.target }} --verbose

    # ✨ 发布冒烟：产物必须能打印版本号并正常退出（防"编译过但起不来"的坏 release）
    # - native：linux-gnu / windows / macOS-arm64 三 leg 本机直接跑
    # - alpine：musl 二进制在 glibc 宿主无法执行，用 Alpine 容器跑（对齐 omp 的
    #   "Smoke musl release binary on Alpine"；纯 Rust+静态 C 依赖产物为全静态，
    #   无需 apk 加库；aarch64 leg 靠上方 QEMU binfmt 透明模拟）
    - name: Smoke test (--version)
      if: startsWith(github.ref, 'refs/tags/') && matrix.smoke == 'native'
      shell: bash
      run: "./target/${{ matrix.target }}/release/${{ matrix.binary }} --version"

    - name: Smoke musl binary on Alpine
      if: startsWith(github.ref, 'refs/tags/') && matrix.smoke == 'alpine'
      shell: bash
      run: |
        set -euo pipefail
        binary="$(realpath "target/${{ matrix.target }}/release/${{ matrix.binary }}")"
        docker run --rm -v "$binary:/usr/local/bin/agent:ro" alpine:3.22 \
          sh -ec 'agent --version'

    # ✨ 核心增补：整理二进制文件 —— 不打包，直接重命名为带平台后缀的裸二进制上传
    # 用户下载后即可直接运行（Linux: ./agent-linux-amd64，Windows: agent-windows-amd64.exe）
    # 二进制名 agent 来自 crates/cli 的 [[bin]] name = "agent"
    - name: Prepare Artifacts
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        set -euo pipefail
        SRC="target/${{ matrix.target }}/release/${{ matrix.binary }}"
        # 显式校验：二进制不存在就直接失败，避免后面建出"只有源码"的空 release
        test -f "$SRC" || {
          echo "❌ $SRC 不存在：请确认 cargo build -r 成功，且 crates/cli 配置了 [[bin]] name=\"agent\""
          exit 1
        }
        mkdir -p dist
        cp "$SRC" "dist/${{ matrix.artifact }}"
        echo "✅ 产物已生成："; ls -lh dist/

    # ✨ 校验和：为每个平台产物生成 SHA256 sidecar，下载方可自行核验完整性
    # windows-latest 的 shell: bash = Git Bash，自带 sha256sum，全平台同一实现
    - name: Generate SHA256 checksum
      if: startsWith(github.ref, 'refs/tags/')
      shell: bash
      run: |
        set -euo pipefail
        cd dist
        sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
        cat "${{ matrix.artifact }}.sha256"

    # ✨ 自动创建 Release 并上传裸二进制 + 校验和 sidecar（非压缩包）
    # softprops/action-gh-release@v2 对并发上传是幂等的：多个 matrix job 同时跑时，
    # 后到的会复用已存在的 release 并追加自己的文件，无需额外协调；
    # SHA256SUMS.txt 汇总由下游 release_sums job 追加（needs: build 保证在全部 leg 之后）
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/${{ matrix.artifact }}
          dist/${{ matrix.artifact }}.sha256
        # 关键：files 没匹配到任何文件时让 Action 直接失败，而不是静默建一个只有源码的 release
        fail_on_unmatched_files: true
        body: |
          Automated Release by GitHub Actions.
          - Commit: ${{ github.sha }}
          - Binaries (download & run directly):
              - Linux x86_64 (glibc):  `agent-linux-amd64`        (+ `.sha256`)
              - Linux x86_64 (musl):   `agent-linux-amd64-musl`   (+ `.sha256`)
              - Linux arm64 (musl):    `agent-linux-arm64-musl`   (+ `.sha256`)
              - macOS arm64 (Apple Silicon): `agent-darwin-arm64` (+ `.sha256`)
              - Windows x86_64:        `agent-windows-amd64.exe`  (+ `.sha256`)
          Verify integrity: `sha256sum -c agent-<platform>.sha256`
          Aggregate checksums: `SHA256SUMS.txt` covers every binary above.
        draft: false
        prerelease: false

  # ─── SHA256SUMS 汇总（对齐 omp release_github：SHA256SUMS.txt 覆盖全部二进制资产）──
  # 与 omp 的差异：omp 先经 actions/upload-artifact 汇聚再统一建 release；Gyre 各 leg
  # 直接幂等上传（见上），本 job 改为【从已发布的 release 重新下载字节再算哈希】——
  # 校验对象就是用户最终下载到的字节，比在构建端预生成更接近"所见即所验"。
  release_sums:
    name: Aggregate SHA256SUMS.txt
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download published release assets
        run: |
          set -euo pipefail
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir dist --clobber
          ls -lh dist/

      # ⚠️ 新增/删除 matrix 目标时必须同步这里：这是 release 资产完整性的硬门，
      # 任一 leg 静默失败（experimental leg 被 continue-on-error 放行）都会在此点名
      - name: Verify completeness and generate SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          expected="agent-darwin-arm64 agent-linux-amd64 agent-linux-amd64-musl agent-linux-arm64-musl agent-windows-amd64.exe"
          missing=0
          for f in $expected; do
            test -f "$f" || { echo "❌ release 缺失资产: $f"; missing=1; }
          done
          [ "$missing" -eq 0 ] || exit 1
          # SHA256SUMS 只覆盖二进制本体：.sha256 sidecar 是同一哈希的另一种呈现，
          # 收进来只会制造两种"真相"；LICENSE/NOTICES 等非产物文件不随 release 发布
          printf '%s\n' $expected | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SHA256SUMS.txt
          fail_on_unmatched_files: true

  # ─── 发布后验证（对齐 omp release_github_verify：build → publish → download → ────
  # ─── checksum → smoke；验的是"发布出来的字节"，而非构建机上的产物）────────────────
  # 差异说明：omp 在 macOS 上验 codesign/签名链（其 darwin 产物有 Developer ID 签名）；
  # Gyre 产物无签名流程，验证点为完整性（SHA256SUMS）+ 可执行性（--version 冒烟）。
  # darwin / windows / musl-arm64 的执行冒烟已分别在各自 build leg 完成（本机/QEMU）；
  # 本 job 补跑 linux-gnu 本机冒烟 + musl-x86_64 Alpine 冒烟。
  release_verify:
    name: Verify published release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release_sums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download published release assets
        run: |
          set -euo pipefail
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir dist --clobber

      - name: Verify all published assets against SHA256SUMS.txt
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Smoke published linux-gnu binary (--version)
        run: |
          set -euo pipefail
          chmod +x dist/agent-linux-amd64
          dist/agent-linux-amd64 --version

      - name: Smoke published linux-musl x86_64 binary on Alpine
        run: |
          set -euo pipefail
          binary="$(realpath dist/agent-linux-amd64-musl)"
          docker run --rm -v "$binary:/usr/local/bin/agent:ro" alpine:3.22 \
            sh -ec 'agent --version'
