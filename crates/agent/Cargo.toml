[package]
name        = "agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agent execution loop: state machine + tool orchestration + approval gate"

[dependencies]
agent-core   = { workspace = true }
agent-ttsr   = { workspace = true }
agent-advisor = { workspace = true }
agent-iso    = { workspace = true }
agent-supervisor = { workspace = true }
agent-tools  = { workspace = true }
agent-hashline = { workspace = true }
agent-config = { workspace = true }
thiserror.workspace = true
dirs = "6"
agent-prompt = { workspace = true }
agent-skills = { workspace = true }
# P2：snapcompact 帧数预算常量（DEFAULT_MAX_FRAMES）。
agent-snapcompact = { workspace = true }
async-trait  = { workspace = true }
async-stream = { workspace = true }
futures      = { workspace = true }
tokio        = { workspace = true }
tokio-util   = { workspace = true }
serde_json   = { workspace = true }
serde        = { workspace = true }
tracing      = { workspace = true }
# Harmony 泄漏检测（多信号正则融合）+ 审计摘要（GPT-5/Codex）
regex        = { workspace = true }
sha2         = { workspace = true }

[dev-dependencies]
# 仅测试用：提供现成的 ContextManager 实现（InMemoryContext）以验证中断兜底持久化。
agent-context = { workspace = true }
# 仅测试用：无中毒检查的快速锁（FallbackProbe 调用记录）。
parking_lot = "0.12"
# 基准门：TTSR 匹配延迟基准（benches/ttsr.rs）
criterion = { workspace = true }
# 目标持久化测试用临时目录。
tempfile = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "ttsr"
harness = false
