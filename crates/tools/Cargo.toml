url          = { workspace = true }
base64       = { workspace = true }
regex        = { workspace = true }
encoding_rs  = { workspace = true }
zip          = { workspace = true }
tar          = { workspace = true }
flate2       = { workspace = true }
rusqlite     = { workspace = true }
[dev-dependencies]
# 基准门：grep/glob 吞吐基准（benches/search.rs）
criterion = { workspace = true }
# 基准夹具：确定性临时小仓库
