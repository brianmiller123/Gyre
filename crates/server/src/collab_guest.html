<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>协同会话 · Gyre</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a22; --border: #262c3a;
    --text: #e6e9ef; --dim: #8b93a7; --accent: #4f8cff; --mine: #1f6feb;
    --err: #ff6b6b; --ok: #3ddc84;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.6 "Segoe UI", system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header .room { font-weight: 600; }
  header code { color: var(--dim); font-size: 12px; }
  .badge { font-size: 12px; padding: 2px 10px; border-radius: 99px; border: 1px solid var(--border); }
  .badge.writable { color: var(--ok); border-color: var(--ok); }
  .badge.readonly { color: var(--dim); }
  #status { margin-left: auto; font-size: 12px; color: var(--dim); }
  #status.on { color: var(--ok); }
  #status.err { color: var(--err); }
  #peers { font-size: 12px; color: var(--dim); }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 76%; align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 6px 12px; }
  .msg.mine { align-self: flex-end; background: var(--mine); border-color: var(--mine); }
  .msg .who { font-size: 11px; color: var(--dim); display: flex; gap: 8px; align-items: baseline; }
  .msg.mine .who { color: rgba(255,255,255,.75); }
  .msg .ts { margin-left: auto; }
  .msg p { margin-top: 2px; word-break: break-word; white-space: pre-wrap; }
  .sys { color: var(--dim); font-size: 12px; font-style: italic; text-align: center; }
  .sys.err { color: var(--err); }
  .snap { border-left: 3px solid var(--accent); background: var(--panel); padding: 6px 12px; font-size: 12px; color: var(--dim); }
  .snap pre { margin-top: 4px; max-height: 200px; overflow: auto; font-size: 11px; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  footer { display: flex; gap: 8px; padding: 10px 16px; background: var(--panel); border-top: 1px solid var(--border); }
  input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; outline: none; }
  input:focus { border-color: var(--accent); }
  input#name { flex: 0 0 140px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 18px; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .fatal { margin: auto; max-width: 480px; text-align: center; color: var(--err); }
</style>
</head>
<body>
<header>
  <div class="room">协同会话 <code id="room"></code></div>
  <span id="mode" class="badge readonly">只读</span>
  <div id="peers"></div>
  <div id="status">连接中…</div>
</header>
<main id="log"></main>
<footer>
  <input id="name" maxlength="24" placeholder="显示名" autocomplete="off">
  <input id="msg" placeholder="消息…（Enter 发送）" autocomplete="off" disabled>
  <button id="send" disabled>发送</button>
</footer>
<script type="module">
"use strict";
/* Gyre 协同 guest：端到端加密（AES-256-GCM，WebCrypto）。
   密封布局与 crates/collab/src/codec.rs 对偶：[12B IV][ciphertext+tag]。
   房间密钥仅存于链接 # 片段（不发给服务器）；中继只见不透明字节。 */
const KEY_LEN = 32, IV_LEN = 12;
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = (id) => document.getElementById(id);

/* ── base64url（无填充）→ Uint8Array ─────────────────────────── */
function b64uDecode(s) {
  let t = s.replace(/-/g, "+").replace(/_/g, "/");
  while (t.length % 4) t += "=";
  const bin = atob(t);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

const roomId = (location.pathname.split("/").filter(Boolean).pop()) || "";
const wt = new URLSearchParams(location.search).get("wt") || null;
$("room").textContent = roomId;

/* ── 密钥 ─────────────────────────────────────────────────────── */
let key = null;
try {
  const raw = b64uDecode((location.hash || "").slice(1));
  if (raw.byteLength !== KEY_LEN) throw new Error("片段不是有效的房间密钥（长度 " + raw.byteLength + "）");
  key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt", "decrypt"]);
} catch (e) {
  fatal("无法解析房间密钥：分享链接须携带 # 片段（#gBF-cHk-…）。" + e.message);
}

let writable = !!wt;
$("mode").textContent = writable ? "可写" : "只读";
$("mode").className = "badge " + (writable ? "writable" : "readonly");
if (!writable) {
  $("msg").placeholder = "只读 view：无写令牌（链接缺少 ?wt=）";
}

/* ── 密封 / 解封 ──────────────────────────────────────────────── */
async function openFrame(data) {
  if (data.byteLength <= IV_LEN) throw new Error("密封帧过短");
  const iv = data.slice(0, IV_LEN);
  const ct = data.slice(IV_LEN);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
  return JSON.parse(dec.decode(pt));
}
async function sealFrame(frame) {
  const iv = crypto.getRandomValues(new Uint8Array(IV_LEN));
  // 注意：subtle.encrypt 返回 ArrayBuffer——必须包 Uint8Array 才能被 out.set 拷贝
  // （TypedArray.set 对 ArrayBuffer 静默不拷贝，曾导致密文缺失、解封恒失败）。
  const ct = new Uint8Array(
    await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(frame)))
  );
  const out = new Uint8Array(IV_LEN + ct.byteLength);
  out.set(iv, 0);
  out.set(ct, IV_LEN);
  return out;
}

/* ── UI 渲染 ──────────────────────────────────────────────────── */
const log = $("log");
const clientId = "g" + Math.random().toString(36).slice(2, 10);
const peers = new Map(); // client_id → display
const snapParts = []; let snapSeq = 0;
let connected = false; // 首个帧已处理（welcome 的丰富状态不被回显帧覆盖）

function fmtTs(ts) {
  const d = new Date(Number(ts) || Date.now());
  return d.toLocaleTimeString("zh-CN", { hour12: false });
}
function short(id) { return id.length > 8 ? id.slice(0, 8) : id; }
function sys(text, cls) {
  const div = document.createElement("div");
  div.className = "sys" + (cls ? " " + cls : "");
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
function chat(id, text, ts) {
  const mine = id === clientId;
  const div = document.createElement("div");
  div.className = "msg" + (mine ? " mine" : "");
  const who = document.createElement("div");
  who.className = "who";
  who.textContent = (mine ? "我" : (peers.get(id) || "访客 " + short(id))) + " · " + fmtTs(ts);
  const p = document.createElement("p");
  p.textContent = text;
  div.appendChild(who);
  div.appendChild(p);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
function snapshotDone(parts) {
  const snap = parts.join("");
  const div = document.createElement("div");
  div.className = "snap";
  div.textContent = "已恢复快照（" + parts.length + " 块 / " + snap.length + " 字符）——以下为快照原文：";
  const pre = document.createElement("pre");
  pre.textContent = snap;
  div.appendChild(pre);
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
function renderPeers() {
  $("peers").textContent = "在线：" + (Array.from(peers.values()).join("、") || "仅你");
}
function setStatus(text, cls) {
  const el = $("status");
  el.textContent = text;
  el.className = cls ? cls : "";
}
function fatal(msg) {
  log.innerHTML = "";
  const div = document.createElement("div");
  div.className = "fatal";
  div.textContent = msg;
  log.appendChild(div);
}

/* ── 帧处理（WireFrame serde tag=type snake_case，与 Rust 对偶） ── */
function handle(f) {
  // 收到任意可解封帧即视为已连接：历史补发先于 welcome 到达，且 host 离线时没有 welcome。
  // 仅置位一次——后续回显帧不覆盖 welcome 的丰富状态（proto/只读裁决）。
  if (!connected && f.type !== "welcome") {
    setStatus("已连接", "on");
    connected = true;
  }
  switch (f.type) {
    case "chat":
      chat(f.client_id, f.text, f.ts);
      break;
    case "hello":
      if (f.client_id !== clientId) {
        peers.set(f.client_id, f.name || "访客 " + short(f.client_id));
        renderPeers();
        sys((f.name || "访客") + " 加入会话");
      }
      break;
    case "welcome":
      // H39：协议版本不匹配 → 明确报错并停止交互（不静默降级，避免状态错乱难查）。
      if (f.proto !== PROTO_VERSION) {
        setStatus("协议版本不匹配（对端 " + f.proto + " / 本端 " + PROTO_VERSION + "）", "err");
        sys("协同协议版本不匹配：请刷新页面或升级到同一版本（Gyre 不保证跨版本兼容）。", "err");
        connected = true;
        return;
      }
      setStatus("已连接（proto " + f.proto + (f.read_only ? "，只读" : "，可写") + "）", "on");
      connected = true;
      // host 下发的会话快照分块：entry_count > 0 时先显示加载态，收齐后由
      // snapshotDone 渲染（每块 48 KiB，大历史分页传输）。
      if (f.entry_count > 0) {
        sys("正在加载会话快照（共 " + f.entry_count + " 块）…");
      }
      // host 裁决优先于链接乐观判定：错误/过期 wt 被 host 判只读 → 收编输入。
      if (f.read_only && writable) {
        writable = false;
        $("msg").disabled = true;
        $("send").disabled = true;
        $("msg").placeholder = "只读 view：host 未授予写权限（链接 wt 无效）";
        $("mode").textContent = "只读";
        $("mode").className = "badge readonly";
      } else if (!f.read_only) {
        writable = true;
        $("msg").disabled = false;
        $("send").disabled = false;
        $("msg").placeholder = "消息…（Enter 发送）";
        $("mode").textContent = "可写";
        $("mode").className = "badge writable";
      }
      break;
    case "presence":
      if (f.online) peers.set(f.client_id, f.display || "访客");
      else peers.delete(f.client_id);
      renderPeers();
      break;
    case "sync":
      sys("收到同步快照（" + f.snapshot.length + " 字符）");
      snapshotDone([f.snapshot]);
      break;
    case "snapshot_chunk": {
      if (f.seq !== snapSeq) {
        sys("快照分块乱序（期望 " + snapSeq + "，收到 " + f.seq + "），已丢弃后续", "err");
        snapSeq = 0;
        snapParts.length = 0;
        break;
      }
      snapParts.push(f.chunk);
      snapSeq++;
      if (f.final_chunk) {
        snapshotDone(snapParts);
        snapSeq = 0;
        snapParts.length = 0;
      }
      break;
    }
    case "bye":
      if (f.client_id !== clientId) {
        peers.delete(f.client_id);
        renderPeers();
        sys("对端离开" + (f.reason ? "：" + f.reason : ""));
      }
      break;
    case "error":
      sys("错误：" + f.message, "err");
      break;
    default:
      sys("未知帧类型：" + f.type);
  }
}

/* ── WebSocket（断线指数退避重连：1s → 2s → 4s → 8s 封顶） ────── */
let ws = null;
let retry = 0;
function connect() {
  const q = new URLSearchParams();
  if (wt) q.set("wt", wt);
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const url = proto + "://" + location.host + location.pathname + (q.size ? "?" + q.toString() : "");
  ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    retry = 0;
    sendHello();
  };
  ws.onmessage = (ev) => {
    if (typeof ev.data !== "object") return; // 只处理 binary（密封帧）
    openFrame(new Uint8Array(ev.data))
      .then(handle)
      .catch((e) => sys("解封失败：" + e.message, "err"));
  };
  ws.onclose = () => {
    setStatus("连接断开，重连中…", "err");
    const delay = Math.min(1000 << Math.min(retry++, 3), 8000);
    setTimeout(connect, delay);
  };
  ws.onerror = () => ws.close();
}
function sendSealed(frame) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  sealFrame(frame)
    .then((b) => ws.send(b))
    .catch((e) => sys("密封失败：" + e.message, "err"));
}
// H39：线协议版本（与 Rust 侧 agent_collab::PROTO_VERSION 同步维护；不匹配显式报错）。
const PROTO_VERSION = 1;
function sendHello() {
  sendSealed({
    type: "hello",
    client_id: clientId,
    proto: PROTO_VERSION,
    name: ($("name").value.trim() || "访客"),
    write_token: wt,
    ts: Date.now(),
  });
  if (writable) {
    $("msg").disabled = false;
    $("send").disabled = false;
    $("msg").focus();
  }
}

/* ── 输入 ─────────────────────────────────────────────────────── */
function sendMsg() {
  const text = $("msg").value.trim();
  if (!text) return;
  sendSealed({ type: "chat", client_id: clientId, text, ts: Date.now() });
  $("msg").value = "";
  $("msg").focus();
}
$("send").addEventListener("click", sendMsg);
$("msg").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
window.addEventListener("beforeunload", () => {
  sendSealed({ type: "bye", client_id: clientId, reason: "离开页面", ts: Date.now() });
});

connect();
</script>
</body>
</html>
