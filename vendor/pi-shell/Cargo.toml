# Vendored from oh-my-pi (third/oh-my-pi/crates/pi-shell); workspace
# references literalized for standalone consumption outside that workspace.
[package]
name = "pi-shell"
version = "18.0.0"
edition = "2024"
license = "MIT"
authors = ["Stencil Labs, Inc."]
repository = "https://github.com/can1357/oh-my-pi"
rust-version = "1.88.0"
# Portions of the minimizer adapt MIT-licensed algorithms from rtk-ai/rtk.
# See NOTICE at this crate root (packaged on publish).

[dependencies]
anyhow = "1.0"
bytes = "1"
pi-builtins = { path = "../pi-builtins" }
brush-core = { path = "../brush-core" }
brush-parser = "0.3"
clap = { version = "4", features = ["derive"] }
os_pipe = "1"
parking_lot = "0.12.5"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
toml = "1.1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
flume = "0.11"
jiff = { version = "0.2", features = ["tzdb-bundle-platform"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
smallvec = { version = "1.15.1", features = ["serde", "write", "union", "const_new"] }
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Media_Audio",
	"Win32_Media_Multimedia",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_Storage_ProjectedFileSystem",
	"Win32_System_Com",
	"Win32_System_LibraryLoader",
	"Win32_System_IO",
	"Win32_System_Ioctl",
	"Win32_System_Threading",
] }
winreg = "0.56"

[dev-dependencies]
tempfile = "3"
