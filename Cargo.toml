[workspace]
resolver = "3"
members  = ["crates/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
license      = "MIT"
authors      = ["agent-project"]
repository   = "https://github.com/brianmiller123/Gyre"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
# pedantic / nursery 整组不作为执法基线：83k 行存量从未在其下维护（2026-09 前 CI 为
# -A warnings），整组开启会产生 600+ 风格噪音且 nursery 官方自述接受不稳定 lint。
# 有真实收益的项显式入选（下方精选），修完后可逐项升回。
pedantic    = { level = "allow", priority = -1 }
nursery     = { level = "allow", priority = -1 }
unchecked_time_subtraction      = "warn"
mutex_integer                  = "warn"
mem_forget                     = "warn"
rc_buffer                      = "warn"
vec_box                        = "warn"
option_option                  = "warn"

# ──────────────────────────────────────────────────────────────────────────────
# 共享依赖（crates 内通过 `dep.workspace = true` 引用）
# ──────────────────────────────────────────────────────────────────────────────
[workspace.dependencies]
# 文件系统隔离
similar     = "3.1"

# 异步与并发
tokio       = { version = "1", features = ["full"] }
parking_lot = "0.12"
tokio-util  = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
async-stream = "0.3"
futures     = "0.3"
futures-util = "0.3"
inventory   = "0.3"
tokio-stream = "0.1"

# 序列化
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# 错误与日志
thiserror   = "2"
ab_glyph   = "0.2"
anyhow      = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 网络 / TLS（跨平台：rustls 免去 Windows OpenSSL）
reqwest     = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks"] }
eventsource-stream = "0.2"
tokio-tungstenite = "0.26"

# Web 服务
axum        = { version = "0.8", features = ["ws"] }
tower-http  = { version = "0.6", features = ["fs", "cors", "trace"] }
# 前端静态资源编译期嵌入二进制（debug 从磁盘热读 / release 内嵌）
rust-embed  = { version = "8", features = ["compression", "include-exclude"] }
mime_guess  = "2"

# 代码操控 / 计数
tiktoken-rs = "0.6"
tree-sitter = "0.25"
# 搜索（移植 pi-natives grep/glob/fd）
ignore     = "0.4"            # ripgrep 核心：尊重 .gitignore 的并行遍历
regex      = "1"
globset    = "0.4"
syntect    = { version = "5", default-features = false, features = ["default-fancy"] }
# LSP 协议类型
lsp-types  = { version = "0.97", features = ["proposed"] }
# URL 解析
url        = "2"
# YAML（swarm 编排定义）
serde_yaml = "0.9"
# 密码学（collab 端到端加密：AES-256-GCM + base64 房间密钥）
aes-gcm    = "0.10"
rand       = { version = "0.8", features = ["std_rng"] }
base64     = "0.22"
# 可选语义嵌入（L2，默认不启用；启用时构建期需联网下载 ONNX Runtime 预编译库，rustls 免 OpenSSL）
fastembed  = { version = "5", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
# 文本编码兜底（run_command 在 Windows 按 OEM 代码页解码非 UTF-8 输出，如 CP936/GBK）
encoding_rs = "0.8"
# 图像 / 剪贴板（CLI 图片粘贴：RGBA→PNG 编码 + 跨平台剪贴板读取）
image      = { version = "0.25", default-features = false, features = ["png"] }
arboard    = "3"
# 散列（hashline 文件版本绑定 / 文件指纹）
sha2       = "0.10"
# 跨平台 PTY（ConPTY / posix openpty）
portable-pty = "0.8"
# 进程组信号（browser 工具关闭时整树击杀 chromium）；nix 0.28 默认无 feature
nix         = { version = "0.28", features = ["signal"] }
# 遥测（OTel）
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", features = ["tonic"] }
tracing-opentelemetry = "0.28"
# ast-grep  = "0.7"   # 阶段5 AST 部分启用

# 配置与跨平台
secrecy     = { version = "0.10", features = ["serde"] }
dirs        = "5"
tempfile    = "3"            # browser 工具临时 --user-data-dir
# read_file 二进制格式面（对齐 omp read：归档/SQLite）
zip         = { version = "2", default-features = false, features = ["deflate"] }
tar         = "0.4"
flate2      = "1"            # .tar.gz 解压
rusqlite    = { version = "0.32", default-features = false, features = ["bundled"] }
glob        = "0.3"            # 命令规则 glob 匹配
uuid        = { version = "1", features = ["v4"] }

# 工具 JSON Schema
schemars    = "0.8"

# CLI
clap        = { version = "4", features = ["derive", "env"] }
rustyline   = { version = "14", features = ["derive"] }

# 基准门：热路径 criterion 基准（对标报告 §六.2；crates/*/benches/ 消费）
criterion   = { version = "0.5", features = ["html_reports"] }

# ── 内部 crate（path 引用）────────────────────────────────────────────────────
agent-core    = { path = "crates/core" }
agent-dap     = { path = "crates/dap" }
agent-browser = { path = "crates/browser" }
agent-snapcompact = { path = "crates/snapcompact" }
agent-config  = { path = "crates/config" }
agent-llm     = { path = "crates/llm" }
agent-mcp     = { path = "crates/mcp" }
agent-memory  = { path = "crates/memory" }
agent-context = { path = "crates/context" }
agent-prompt  = { path = "crates/prompt" }
agent-tools   = { path = "crates/tools" }
agent-eval    = { path = "crates/eval" }
agent-ast     = { path = "crates/ast" }
agent-advisor = { path = "crates/advisor" }
agent-discovery = { path = "crates/discovery" }
agent-search  = { path = "crates/search" }
agent-skills  = { path = "crates/skills" }
agent-lsp     = { path = "crates/lsp" }
agent-iso     = { path = "crates/iso" }
agent-server  = { path = "crates/server" }
agent-proxy   = { path = "crates/proxy" }
agent         = { path = "crates/agent" }
agent-telemetry = { path = "crates/telemetry" }
agent-swarm   = { path = "crates/swarm" }
agent-hashline = { path = "crates/hashline" }
agent-pty     = { path = "crates/pty" }
agent-collab  = { path = "crates/collab" }
agent-supervisor = { path = "crates/supervisor" }
agent-acp     = { path = "crates/acp" }
agent-i18n    = { path = "crates/i18n" }
agent-ttsr    = { path = "crates/ttsr" }
agent-cli     = { path = "crates/cli" }

agent-shell  = { path = "crates/shell" }

# ── 进程内工具（vendor 自 oh-my-pi，见 docs/oh-my-pi-*）────────────────────────
pi-shell     = { path = "vendor/pi-shell" }
pi-builtins  = { path = "vendor/pi-builtins" }
pi-walker    = { path = "vendor/pi-walker" }
brush-core   = { path = "vendor/brush-core" }

[patch.crates-io]
brush-core = { path = "vendor/brush-core" }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 16
strip         = true
